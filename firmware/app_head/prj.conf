# Head unit firmware configuration
# SPDX-License-Identifier: GPL-3.0-or-later

# --- Radio: Nordic ESB, broadcast fabric (PROTOCOL.md Part 2) ---
CONFIG_ESB=y
# 26 B ORIENT / 22 B RAW / beacons all fit the 32 B DPL cap.
CONFIG_ESB_MAX_PAYLOAD_LENGTH=32

# --- Fusion: vendored VQF is single-file C++ ---
CONFIG_CPP=y
# M4F: keep VQF (single precision, see common.cmake) on the hardware FPU.
CONFIG_FPU=y
# Both the IMU trigger thread and the fusion thread touch float registers.
CONFIG_FPU_SHARING=y

# --- IMU: onboard LSM6DS3TR-C via Zephyr lsm6dsl driver ---
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LSM6DSL=y
# DRDY handled in the driver's own thread; never fetch in ISR context.
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y
# Trigger thread must outrank the fusion thread so a fresh sample can always
# preempt into the 1-slot "latest wins" queue.
CONFIG_LSM6DSL_THREAD_PRIORITY=4
CONFIG_LSM6DSL_THREAD_STACK_SIZE=1536
# ODR 0 = runtime-configurable via SENSOR_ATTR_SAMPLING_FREQUENCY (416 Hz set
# in main.c; also lets standby drop the ODR).
CONFIG_LSM6DSL_ACCEL_ODR=0
CONFIG_LSM6DSL_GYRO_ODR=0
# Full scales are compile-time; MUST match HTK_FS_MAKE(GYRO_2000DPS, ACC_4G)
# advertised in RAW packets and the LSB reconversion constants in main.c.
CONFIG_LSM6DSL_ACCEL_FS=4
CONFIG_LSM6DSL_GYRO_FS=2000

# --- LEDs ---
CONFIG_GPIO=y

# --- Logging: deferred so log formatting never sits in the sample path.
# Battery-powered unit with no UART attached: console off, no log backend by
# default (messages are compiled in but dropped). For bench debug, enable the
# RTT backend or UART console locally.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# --- Stacks ---
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
