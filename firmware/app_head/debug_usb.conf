# Debug build variant: USB CDC console so the head unit can be interrogated
# on a bench without a debug probe. Build with:
#   west build ... -- -DEXTRA_CONF_FILE=debug_usb.conf \
#                     -DEXTRA_DTC_OVERLAY_FILE=debug_usb.overlay
# NOT for the worn unit: USB stack + logging cost power and timing.
# SPDX-License-Identifier: GPL-3.0-or-later
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="headtracker head-debug"
# app_head never calls usb_enable() (production build has no USB); let the
# stack bring itself up at boot in this debug variant.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
# bursts of adjacent LOG_INFs were dropping in deferred mode at the default 1k
CONFIG_LOG_BUFFER_SIZE=8192
