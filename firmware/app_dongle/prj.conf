# app_dongle — USB receiver dongle (XIAO nRF52840 Sense)

# --- Radio: Nordic ESB. ESB owns IRQ priorities 0-1; every other peripheral
# must sit at >= 2 (USBD is bumped in the boards/ overlay).
CONFIG_ESB=y
# Air payloads are <= 26 B; 32 is the ESB DPL cap (and the Kconfig default).
CONFIG_ESB_MAX_PAYLOAD_LENGTH=32

# --- USB: legacy device stack for v0.1.
# NOTE: migration to the new usbd stack (CONFIG_USB_DEVICE_STACK_NEXT) is
# planned; the legacy stack is used for now because it is proven alongside the
# ESB sample scaffolding (PRD risk 4). Revisit at M6.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="headtracker dongle"

# CDC-ACM is driven through the interrupt-driven UART API + a TX frame ring.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# LEDs
CONFIG_GPIO=y

# Simulator uses sinf/cosf; M4F hard-float.
CONFIG_FPU=y

# Logging: deferred so log processing never sits in the radio/USB data path.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
